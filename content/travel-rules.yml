# Travel Rules — the site's front page.
#
# Colour conventions inside any text: ++green++, --red--, !!amber!!
# Links: [label](page.html)

head:
  kicker: Core rules
  title: Travel Rules
  summary: >
    Survival and navigation for wild exploration across Azeroth — overland travel runs on a
    6-mile hex grid with an 8-hour daily march.
  stats:
    - { value: "4", label: daily phases }
    - { value: "3", label: travel paces }
    - { value: d20, label: encounter check }

intro: >
  Traveling through Azeroth is rarely a peaceful stroll down the King's Road. Whether braving the
  toxic bogs of Dustwallow, the freezing winds of Frostfire Ridge, or the blighted soil of the
  Plaguelands, wilderness travel requires preparation, teamwork, and vigilance.

phase_loop:
  heading: The Travel Phase Loop
  note: Every day on the road follows the same five-step procedure, in order.
  steps:
    - name: Roll environment
      text: >
        The GM rolls 1d6 on the current zone's [weather table](biomes.html) for the day's hazards
        and DC modifiers.
    - name: Determine pace & assign roles
      text: >
        Knowing the weather, the party selects a **Fast**, **Normal**, or **Slow** pace, and each
        player chooses one [travel activity](activities.html) — Scout, Hunter, Pioneer, and more.
    - name: March the trail
      text: >
        Move party tokens across the map based on chosen pace and resolve passive/active role checks.
    - name: Check for encounters
      text: >
        Roll a d20 for wilderness events, points of interest, or ambushes. Encounters trigger on **18–20**.
    - name: Resolve exhaustion
      text: >
        If the march ends in the wilderness, apply Pioneer and Motivate modifiers before rolling 
        **Exhaustion saves**. Ending the day inside a safe town or hub waives this check completely.

pace:
  heading: Travel Pace
  columns: [Pace, Distance / day, Effect, Restrictions]
  rows:
    - pace: Fast
      distance: 30 miles (5 hexes)
      effect: "−5 passive Perception"
      restrictions: Cannot stealth.
    - pace: Normal
      distance: 24 miles (4 hexes)
      effect: Standard
      restrictions: Standard travel operations.
    - pace: Slow
      distance: 18 miles (3 hexes)
      effect: Advantage on daily Exhaustion saves
      restrictions: Group can use Stealth to avoid encounters.

hazards:
  heading: Wilderness Hazards
  note: >
    Unlike standard high-fantasy travel, the wilds of Azeroth carry environmental corruption,
    elemental instability, and hostile factions.
  callouts:
    - kind: danger
      title: Fel & Blight contamination
      text: >
        Unpurified water or food gathered in corrupted biomes requires a **DC 13 Constitution
        saving throw** to avoid disease or gaining a level of exhaustion.
    - kind: warning
      title: Resting constraints
      text: >
        A _Long Rest_ taken in unfortified wilderness prevents recovering levels of Exhaustion
        and carries high encounter risks. To rest safely in the wild, the party must deploy a heavy
        **Fortification Kit** (secures a campsite for up to 3 days). The party can carry a **maximum of 2 Kits**
        at any time, which can be restocked at any non-hostile village or hub.
    - kind: info
      title: Daily exhaustion check
      text: >
        At the end of each travel day in the wilderness, every character makes a **Constitution saving throw**
        against the **zone baseline DC + daily weather modifier**. On a failure, the character
        gains 1 level of Exhaustion. Reaching a [Safe Spot](settlements.html) waives this check, while 
        clearing existing exhaustion requires an Inn stay, a Fortified Camp, or a successful [Motivate](activities.html#motivate) roll.

gm_checklist:
  heading: GM Checklist — Per Travel Day
  items:
    - id: weather
      text: >
        **Roll weather** — roll 1d6 on the active zone's weather chart in the
        [Biome Compendium](biomes.html) to set daily hazards and DC modifiers.
    - id: rations
      text: >
        **Track supplies** — enforce consumption of 1 ration & 1 gallon of water per character.
    - id: exhaustion
      text: >
        **Check exhaustion** — if ending the march in the wilderness, resolve Pioneer/Motivate
        modifiers and have characters roll Con saves vs **Zone Baseline DC + Weather**. 
        (Waived inside safe towns or hubs).

