# Biome Compendium — 61 zones.
#
# Adding a zone: copy a block under `zones`. `continent` builds the filter
# chips automatically, so a new continent needs no code change. `severity`
# colours the card (mild/harsh/deadly) and `dc` is the exhaustion baseline
# the weather roller adds its modifier to. Each zone needs 3 weather rows
# covering rolls 1–6.

head:
  kicker: Reference
  title: Biome Compendium
  summary: >
    Environmental hazards, weather tables, and survival DCs for every zone the party can cross —
    Kalimdor, the Eastern Kingdoms, Outland, and Northrend.
  stats:
    - { value: "61", label: zones }
    - { value: "4", label: continents }
    - { value: 1d6, label: daily weather }

primer:
  heading: Weather & Exhaustion Primer
  cards:
    - heading: Biome classes
      def_rows:
        - { key: DC 10, tone: mild, text: "**Mild** — temperate forests, pastoral plains, magical sanctuaries. Resources abound." }
        - { key: DC 13, tone: harsh, text: "**Harsh** — jungles, deserts, swamps, tundras, and alpine crags." }
        - { key: DC 16, tone: deadly, text: "**Deadly** — volcanic wastes, scourgelands, fel-shatters, glacial peaks." }
    - heading: Daily weather (1d6)
      def_rows:
        - { key: 1–3, tone: neutral, text: "**Clear** · +0 DC — standard visibility, pace, and resource use." }
        - { key: 4–5, tone: rare, text: "**Moderate** · +2 DC — lightly obscured; ranged attack range halved; unpaved ground is difficult terrain." }
        - { key: "6", tone: deadly, text: "**Severe** · +4 DC — heavily obscured; disadvantage on Perception and ranged attacks; extreme heat or cold doubles resource depletion or deals periodic damage." }
    - heading: Hex navigation sequence
      ordered:
        - Roll **1d6 for daily weather** to set the DC modifier and active hazards.
        - Determine travel pace — fast, normal, or slow.
        - "**Wisdom (Survival)** check to navigate hexes without marked roads."
        - >
          At day's end, every character makes a **Constitution save** vs. baseline + weather DC.
          Failure: 1 level of Exhaustion.

zones_section:
  heading: Zones
  note: >
    Filter by continent or severity, search by name or feature, then open a zone and roll its
    daily weather.

