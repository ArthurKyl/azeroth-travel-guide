# Settlement Downtime. Each location needs EITHER `options` (discrete things to
# do, with a cost) OR `mechanic_line` + `tiers` (one roll on a d20 table).
#
#   accent   → the dot colour and card highlight
#   check    → either { skills: [...] } or { note: "No check — automatic" }
#   outcome  → result: success | failure | nat  (colours the label)

head:
  kicker: Core rules
  title: Settlement Downtime
  summary: >
    When the party reaches a village or city, the march pauses and downtime begins. Every
    settlement — from Goldshire to Dalaran — offers the same six locations. Each day in town,
    every character commits to one of them.
  stats:
    - { value: "6", label: locations }
    - { value: "every", label: village & city }
    - { value: "1", label: token per character per day }

rules:
  heading: Downtime Rules
  cards:
    - heading: Safe Spot
      text: >
        Every settlement is a **Safe Spot**: a night's rest here automatically clears all
        [Exhaustion](index.html) gained on the road — no Camping or Fortification check needed.
        Restock supplies and Fortification Kits before heading back into the wilds.
    - heading: Settlement Reputation
      text: >
        Track Reputation standing with individual factions and hubs. Perform local favors, trade,
        and turn in quest objectives to earn **Reputation XP** (typically +5 to +20 per task).
      def_rows:
        - { key: "Hated", tone: deadly, text: "**Unwelcome (< 0 XP)** — Downtime checks +4 DC, guards follow, basic services refused." }
        - { key: Neutral, tone: neutral, text: "**Baseline (0–10 XP)** — Standard DCs and basic downtime access." }
        - { key: Friendly, tone: mild, text: "**Welcomed (11–30 XP)** — Downtime checks -2 DC, locals share rumors freely." }
        - { key: Honored, tone: rare, text: "**Respected (31–60 XP)** — Downtime checks -4 DC, rare goods and specialist training unlocked." }
        - { key: Revered, tone: epic, text: "**Heroic (61–90 XP)** — Auto-succeed basic downtime checks, elite quest hooks, free lodging." }
        - { key: Exalted, tone: epic, text: "**Local Champion (100 XP)** — Full faction authority, key to a private sanctuary, high council access." }

grid:
  heading: The Six Locations
  note: >
    Available in every village and city, regardless of region. Costs scale with settlement
    size — a copper-pinch hamlet versus a gilded capital.

locations:
  - id: tavern
    name: The Tavern
    accent: "#d9973b"
    tagline: Information, social lubrication & local rumors
    options:
      - title: Drink & Gossip
        cost: Free
        check: { note: "Optional — Any skill with GM approval (e.g. Persuasion, Stealth, Investigation)" }
        outcome:
          result: success
          label: "Effect:"
          text: >
            Mingle with locals or eavesdrop to hear regional rumors, map leads, or quest hints (no roll needed for basic chatter).
            If a check is required for guarded secrets, players can use any skill they can logically justify to the GM.
      - title: Buy a Round
        cost: "1d20 gold · or GM discretion by settlement size"
        check: { note: "Automatic success" }
        outcome:
          result: success
          label: "Effect:"
          text: >
            Loosen local tongues and earn an immediate **+3 Reputation XP** with the settlement.
            The party automatically learns standard local gossip, and any GM-requested checks here today are made with **Advantage**.

  - id: square
    name: The Town Square
    accent: "#5b9fd6"
    tagline: Civic goodwill, open inquiries & local standing
    options:
      - title: Civic Favor
        cost: Minor effort or small gift
        check: { note: "Automatic success · Roleplay focus" }
        outcome:
          result: success
          label: "Effect:"
          text: >
            Help push a heavy cart, repair a fence, or assist local guards. Earn **+3 Reputation XP**
            with the settlement without spending gold.
      - title: Mingle & Ask
        cost: Free
        check: { note: "Optional — Any skill with GM approval (e.g. Persuasion, Insight, History)" }
        outcome:
          result: success
          label: "Effect:"
          text: >
            Fish for public quest hooks, local notice board jobs, or immediate civic needs. Basic inquiries
            require no roll, while success on GM checks unlocks subtle clues or hidden opportunities.

  - id: underbelly
    name: The Underbelly
    accent: "#a887d9"
    tagline: High-risk secrets, black markets & illicit opportunities
    mechanic_line: >
      Single check: **Dexterity (Stealth)**, **Charisma (Deception)**, **Intelligence (Investigation)**, or any shady skill with GM approval.
    tiers:
      - tier: poor
        range: "1–9"
        text: >
          **You stand out.** Nobody talks to you. Local thugs or guards watch with suspicion — lose **3 Reputation XP**.
      - tier: rare
        range: "10–14"
        text: >
          **Whispered secrets.** Uncover hidden lore, secret faction moves, or a lead on a local fence for selling stolen goods.
      - tier: epic
        range: "15+"
        text: >
          **Black market & high-risk job.** Unlock a hidden shady vendor (poisons, illicit gear, contraband) or receive an off-the-books job offer: high coin, high threat, morally gray objectives.

  - id: scout-den
    name: The Scout Den
    accent: "#79b95e"
    tagline: Wilderness preparation, local trappers & hexcrawl intel
    mechanic_line: "Single check: **Wisdom (Survival)**, **Intelligence (Nature)**, or a relevant wilderness skill"
    tiers:
      - tier: poor
        range: "1–9"
        text: Conflicting stories and bad advice. **No bonus.**
      - tier: uncommon
        range: "10–14"
        text: >
          **−2** to Biome Exhaustion DCs for the **next 2 days** — hunters outline safe paths through immediate hexes.
      - tier: rare
        range: "15–19"
        text: >
          **−3** to Biome Exhaustion DCs for the **next 3 days** — trappers point out hidden animal trails and water sources.
      - tier: epic
        range: "20+"
        text: >
          **−5** to Biome Exhaustion DCs for the **next 3 days**, and **reveal 1 Point of Interest** on the regional map nearby — detailed intel on hazard zones, ruins, or monster nests.
    stack_note: >
      Wilderness intel stacks fully with the [Pioneer](activities.html#pioneer) activity, making properly surveyed marches exceptionally safe.

  - id: chapel
    name: The Chapel / Shrine
    accent: "#e9e7e2"
    tagline: Sanctuary, spiritual purification & divine favor
    options:
      - title: Devotion & Prayer
        cost: Free
        check: { note: "Automatic or GM discretion" }
        outcome:
          result: success
          label: "Effect:"
          text: |
            Offer a prayer to the Light, Elune, the Loa, or ancestral spirits. The GM grants a flavor boon or subtle sign based on your deity. Examples:

            - **Holy Light / Elune:** Gain temporary HP equal to your level upon leaving town.
            - **The Loa / Wild Gods:** Learn the location of a hidden shrine or beast nest in a nearby hex.
            - **Ancestors / Spirits:** Gain Advantage on your first skill check on the trail tomorrow.
      - title: Sacred Services
        cost: "10–50 gold · or GM discretion by settlement size"
        check: { note: "Automatic success" }
        outcome:
          result: success
          label: "Effect:"
          text: >
            Acolytes or shamans cleanse the body and soul. Cures **all active poisons, diseases, or Fel/Blight corruptions**, and grants **+3 Reputation XP** with the settlement.

  - id: watchtower
    name: The Watchtower
    accent: "#e0622d"
    tagline: Military surveillance, patrol logs & tracking hidden forces
    mechanic_line: "Single check: **Intelligence (History or Investigation)**, **Wisdom (Perception)**, or military tactics"
    tiers:
      - tier: poor
        range: "1–9"
        text: >
          **Outdated logs.** Conflicting reports and old scout entries. You learn nothing about current threat movements.
      - tier: uncommon
        range: "10–14"
        text: >
          **General area.** The guards confirm the general vicinity of a major threat, warband, or hidden force active in the region.
      - tier: rare
        range: "15–19"
        text: >
          **Area & direction.** Learn the general location and active direction of travel for a nearby hidden threat.
      - tier: epic
        range: "20+"
        text: >
          **Tactical tracking.** Reveal the exact current location of 1 hidden threat on the map, and track its movement on your map for 1–2 days (GM discretion).
