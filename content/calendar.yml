    - { index: 7, name: Spirit's Day, assoc: "Ancestral Spirits, Elements, Wild Gods" }

moons:
  heading: The Two Moons
  note: >
    Azeroth is orbited by two celestial bodies: the primary moon, the **White Lady** (also known
    as Lady Forlorn or Mu'sha), and the secondary moon, the **Blue Child**.
  list:
    - name: The White Lady
      cycle: 26-day cycle
      lit: "#e9e7e2"
      tagline: >
        Its cycle dictates tidal movements, ley-line fluidities, and night elven moonwell
        recharge rates.
      phases:
        - { glyph: "new", days: 1 – 3, name: New Moon, text: "Dark sky; arcane stealth heightened; moonwell recharge drops" }
        - { glyph: waxing-crescent, days: 4 – 6, name: Waxing Crescent, text: "Thin silver sliver; Sentinels begin nocturnal rites" }
        - { glyph: first-quarter, days: 7 – 9, name: First Quarter, text: "Half-disc light; arcane flux stabilizes across ley-nodes" }
        - { glyph: waxing-gibbous, days: 10 – 13, name: Waxing Gibbous, text: "Expanding illumination; druidic growth spells amplified" }
        - { glyph: "full", days: 14 – 16, name: Full Moon, text: "Maximum brilliance; lunar light peaks; moonwells overflow.", peak: "Peak: day 15" }
        - { glyph: waning-gibbous, days: 17 – 20, name: Waning Gibbous, text: "Diminishing disc; night elven shadow-melding efficacy rises" }
        - { glyph: last-quarter, days: 21 – 23, name: Last Quarter, text: "Crescent inflection; shadow and void magic stabilization" }
        - { glyph: waning-crescent, days: 24 – 26, name: Waning Crescent, text: "Dying sliver; spirit-realm thinness increases near graveyards" }
    - name: The Blue Child
      cycle: 91-day cycle
      lit: "#5b9fd6"
      blue: true
      peak_badge: skill
      tagline: >
        A wider, slower orbital path with a distinct cerulean hue — one full turn per season,
        four to the year.
      phases:
        - { glyph: "new", days: 1 – 17, name: New Child, text: "Dark sky; the Blue Child completely obscured" }
        - { glyph: waxing-crescent, days: 18 – 36, name: Waxing Sapphire, text: "Faint blue crescent expanding in the western sky" }
        - { glyph: "full", days: 37 – 55, name: Full Child, text: "Radiant azure disc; Wild God instincts heightened.", peak: "Peak: day 46" }
        - { glyph: waning-gibbous, days: 56 – 74, name: Waning Azure, text: "Fading blue disc shrinking toward the eastern horizon" }
        - { glyph: waning-crescent, days: 75 – 91, name: Crescent Veil, text: "Thin blue thread; unstable planar shifts in the Emerald Dream" }

syzygy:
  heading: Syzygy — The Double Full Moon
  note: >
    Syzygy is the night both moons hit their **peak** together — White Lady day 15 and Blue Child
    day 46 falling on the same date. The two cycles resonate every **182 days** (26 × 7 = 182,
    and 91 × 2 = 182), which is exactly 26 weeks. Since 2 × 182 = 364 and a third would need 546,
    a 365-day year always holds exactly two.
  days:
    - { number: "146", where: Solstice Peak 26, note: First syzygy of 27 ADP }
    - { number: "328", where: Deepwinter 24, note: Second syzygy of 27 ADP }
  callouts:
    - kind: warning
      title: The slip
      text: >
        The year runs one day longer than two syzygy intervals (365 − 364 = 1), so the pair falls
        **one day earlier each year**: Solstice Peak 25 and Deepwinter 23 in 28 ADP, Solstice Peak
        24 and Deepwinter 22 in 29 ADP, and so on. It takes 182 years for the alignment to walk
        the calendar once — which is exactly the sort of thing Kirin Tor astronomers keep tables
        for.
    - kind: info
      title: Arcano-lunar tides
      text: |
        During syzygy, Azeroth experiences arcano-lunar tides:

        - **Ley-line throughput surges by 300%.**
        - **Druids and Priests of Elune** experience doubled mana recovery rates.
        - **Planar boundaries** between Azeroth, the Emerald Dream, and the Spirit Realm thin significantly.

        Both moons can show a full face on the same night without a syzygy — the Blue Child's Full Child phase alone runs 19 days. Only the coinciding **peak** days count.

module:
  heading: Module Reference
  note: >
    Everything a calendar module needs: whole-day cycle lengths, phase lengths in order, and a
    reference date for day 1 of each cycle. From these two anchors the peaks coincide on Day 146
    of 27 ADP, then every 182 days thereafter.
  columns: [Moon, Cycle, "Phase lengths, in order", Peak, Cycle day 1]
  rows:
    - moon: White Lady
      cycle: 26 days
      lengths: "3, 3, 3, 4, 3, 4, 3, 3"
      peak: Day 15
      anchor: "27 ADP, Solstice Peak 12"
    - moon: Blue Child
      cycle: 91 days
      lengths: "17, 19, 19, 19, 17"
      peak: Day 46
      anchor: "27 ADP, Highspring 11"

