    - { index: 2, name: Moon's Day, assoc: "Lunar Energy, Elune, Mu'sha" }
    - { index: 3, name: Earth's Day, assoc: "Terrestrial Forces, Deep Stone, Earthmother" }
    - { index: 4, name: Arcane's Day, assoc: "Ley-Line Resonance, Arcane Order" }
    - { index: 5, name: Forge's Day, assoc: "Metal, Industrial Craft, Fire" }
