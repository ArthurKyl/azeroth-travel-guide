# Calendar & Moons.
#
# Moon phases: `glyph` picks the drawn shape — new, waxing-crescent,
# first-quarter, waxing-gibbous, full, waning-gibbous, last-quarter,
# waning-crescent. Phase `days` must cover the cycle with no gaps; `lit` is
# the moon's colour. If you change a cycle length, re-check the syzygy maths
# below (they are lcm(white, blue) apart).

head:
  kicker: Reference
  title: Calendar & Moons
  summary: >
    How time is tracked on Azeroth — the ADP epoch, twelve solar months, the seven-day week,
    and the two moons whose cycles drive tides, ley-lines, and moonwell recharge.
  stats:
    - { value: "365", label: days per year }
    - { value: "12", label: months }
    - { value: "2", label: moons }
    - { value: "182", label: -day syzygy }

epoch:
  heading: The ADP Epoch
  note: >
    Temporal tracking across Azerothian societies relies on the **After the Dark Portal (ADP)**
    and **Before the Dark Portal (BDP)** epoch system.
  cards:
    - heading: Year 0
      text: >
        The opening of the rift between Azeroth and Draenor marks **Year 0 ADP**. Eras preceding
        this pivot point are numbered in reverse as **BDP**; everything after increments forward.
    - heading: The campaign present
      text: >
        Under this framework, the onset of the Northrend campaign during the **Wrath of the Lich
        King** occurs in **Year 27 ADP** — see the [Historical Timeline](timeline.html).
    - heading: The solar year
      text: >
        The standardized solar year spans exactly **365 days** across **twelve months** of fixed
        length, structured around the equinoxes and solstices. The week runs on a continuous
        **7-day** cycle.

