eras:
  - id: first-war
    name: The First War
    span: 0 – 5 ADP
    chapter: history
    events:
      - year: 0
        month: 1
        day: 1
        kind: main
        title: Medivh's Astral Convergence & the Archway Ignites
        desc: >-
          Guardian Medivh, possessed by Sargeras, completes the channel at the Black Morass
          alongside Gul'dan on Draenor, stabilizing the spatial tear.
      - year: 0
        month: 2
        day: 15
        kind: pre
        title: Black Morass Scout Incursions
        desc: >-
          Orcish scouting parties under Kilrogg Deadeye emerge into the swamps. Kingdom of
          Stormwind border patrols report missing scouts and unnatural fel decay spreading
          through vegetation.
      - year: 0
        month: 4
        day: 10
        kind: pre
        title: Medivh's Erratic Behavior
        desc: >-
          Medivh isolates himself within Karazhan. Arcane feedback loops from the tower trigger
          temporal distortions across the Redridge Mountains.
      - year: 0
        month: 6
        day: 1
        kind: pre
        title: Blackrock Clan Skirmishes
        desc: >-
          Blackrock clan raiding parties push into Grand Hamlet and Moonbrook. King Llane Wrynn
          dispatches Sir Anduin Lothar and the Knights of Stormwind to fortify rural supply
          lines.
      - year: 0
        month: 9
        day: 12
        kind: main
        title: First Siege of Stormwind Keep
        desc: >-
          Warchief Blackhand orders a direct assault on Stormwind City. Human archers and knight
          counter-charges inflict massive casualties on the Horde, forcing a temporary tactical
          retreat back to the Redridge foothills.
      - year: 3
        month: 5
        day: 20
        kind: pre
        title: Southern Farmland Devastation
        desc: >-
          Horde warbands raze Westfall, Duskwood, and Redridge, destroying Stormwind's
          agricultural base and threatening the city with starvation.
      - year: 4
        month: 10
        day: 14
        kind: pre
        title: The Karazhan Infiltration
        desc: >-
          Khadgar and Garona Halforcen inform Lothar of Medivh's betrayal. A strike team marches
          to Karazhan to eliminate the Guardian.
      - year: 4
        month: 10
        day: 28
        kind: main
        title: Death of Medivh
        desc: >-
          Lothar and Khadgar decapitate Medivh in Karazhan's catacombs. Gul'dan enters Medivh's
          mind at the moment of death to extract the location of the Tomb of Sargeras, falling
          into a profound coma.
      - year: 5
        month: 2
        day: 28
        kind: main
        title: Assassination of King Llane and Fall of Stormwind
        desc: >-
          Mind-controlled by the Shadow Council, Garona assassinates King Llane Wrynn I inside
          Stormwind Keep. Orgrim Doomhammer slays Blackhand to seize the Warchief mantle. Horde
          forces breach the city gates, burning Stormwind. Lothar gathers survivors and
          initiates a naval evacuation north across the Great Sea.
  - id: second-war
    name: The Second War & Beyond
    span: 4 – 8 ADP
    chapter: history
    events:
      - year: 5
        month: 4
        day: 10
        kind: pre
        title: Refugee Landing at Southshore
        desc: >-
          Stormwind's fleet lands at Southshore. Lord Lothar meets King Terenas Menethil II,
          warning Lordaeron of the impending invasion.
      - year: 5
        month: 6
        day: 1
        kind: pre
        title: Alliance of Lordaeron Formation
        desc: >-
          Terenas calls the sovereign human kingdoms (Lordaeron, Gilneas, Stromgarde, Alterac,
          Dalaran, Kul Tiras) to a council. They sign the Alliance Treaty and establish the
          Knights of the Silver Hand under Uther the Lightbringer.
      - year: 5
        month: 8
        day: 15
        kind: pre
        title: Horde March Through Khaz Modan
        desc: >-
          Doomhammer's forces subjugate Khaz Modan, besieging the Dwarves inside Ironforge and
          capturing the foundries of Grim Batol.
      - year: 5
        month: 11
        day: 20
        kind: pre
        title: Naval Mobilizations in the Great Sea
        desc: >-
          Admiral Daelin Proudmoore mobilizes the Kul Tiras armada to intercept Horde transports
          built by enslaving Goblin cartels.
      - year: 6
        month: 3
        day: 12
        kind: main
        title: Siege of Lordaeron
        desc: >-
          The Horde drives through the Hinterlands and Eversong Woods, laying siege to Capital
          City. Alterac's Lord Perenolde betrays the Alliance by opening mountain passes to the
          Horde. Gul'dan abandons the front lines with the Stormreaver and Twilight's Hammer
          clans to locate the Tomb of Sargeras, forcing Doomhammer to divide his forces.
      - year: 6
        month: 8
        day: 5
        kind: main
        title: Battle of Blackrock Spire
        desc: >-
          Turalyon and Lothar shatter the Horde vanguard. Doomhammer slays Lothar in single
          combat at the base of the spire, but Turalyon rallies the Alliance, breaking the Horde
          and capturing Doomhammer.
      - year: 6
        month: 9
        day: 18
        kind: main
        title: Destruction of the Dark Portal
        desc: >-
          Highmage Khadgar uses the Book of Medivh to destroy the Dark Portal's physical
          structure, severing the link to Draenor.
      - year: 7
        month: 1
        day: 10
        kind: pre
        title: Draenor Energy Instability Leaks
        desc: >-
          Ner'zhul uses remaining magical rifts on Draenor to send death knights through to
          acquire powerful artifacts.
      - year: 8
        month: 4
        day: 18
        kind: pre
        title: Sons of Lothar Expeditionary Assembly
        desc: >-
          General Turalyon, Khadgar, Alleria Windrunner, Kurdran Wildhammer, and Danath
          Trollbane gather an expeditionary force at Nethergarde Keep.
      - year: 8
        month: 9
        day: 22
        kind: main
        title: Beyond the Dark Portal Campaign & Draenor's Collapse
        desc: >-
          The Sons of Lothar invade Draenor to retrieve the stolen artifacts. Ner'zhul opens
          multiple planar rifts simultaneously, causing spatial feedback that shatters Draenor
          into Outland. Khadgar seals the rift from within Draenor to protect Azeroth.
  - id: third-war
    name: The Third War
    span: 20 – 22 ADP
    chapter: history
    events:
      - year: 20
        month: 1
        day: 15
        kind: pre
        title: Plagued Grain Rumors in Lordaeron
        desc: >-
          Reports reach Capital City regarding tainted grain shipments originating from Andorhal
          and spreading through eastern farming villages.
      - year: 20
        month: 2
        day: 10
        kind: pre
        title: Cult of the Damned Mobilization
        desc: >-
          Kel'Thuzad organizes covert Cult of the Damned cells across Lordaeron, establishing
          underground necromantic laboratories.
      - year: 20
        month: 3
        day: 5
        kind: pre
        title: Stratholme Infiltration
        desc: >-
          Infected grain shipments enter the central distribution hub at Stratholme. Prince
          Arthas Menethil and Uther the Lightbringer march to intercept the convoys.
      - year: 20
        month: 4
        day: 12
        kind: main
        title: The Culling of Stratholme
        desc: >-
          Assessing that the populace is beyond salvation, Arthas purges Stratholme's citizens,
          causing Uther and Jaina Proudmoore to abandon his command.
      - year: 20
        month: 7
        day: 20
        kind: main
        title: Scourging of Quel'Thalas
        desc: >-
          Returning from Northrend as a Death Knight wielding Frostmourne, Arthas slays King
          Anasterian and Ranger-General Sylvanas Windrunner. He defiles the Sunwell to resurrect
          Kel'Thuzad as a lich.
      - year: 20
        month: 10
        day: 1
        kind: main
        title: Fall of Lordaeron and Dalaran
        desc: >-
          Arthas murders King Terenas II. Kel'Thuzad uses the Book of Medivh to summon
          Archimonde, who demolishes Dalaran.
      - year: 21
        month: 2
        day: 14
        kind: pre
        title: Western Exodus
        desc: >-
          Guided by the Prophet Medivh, Thrall frees the internment camps and sails for
          Kalimdor; Jaina Proudmoore gathers human survivors and sets sail west.
      - year: 21
        month: 6
        day: 22
        kind: main
        title: Battle of Mount Hyjal
        desc: >-
          The grand alliance of Night Elves, Orcs, and Humans holds the slopes of Mount Hyjal.
          Malfurion Stormrage detonates the ancestral spirits of Nordrassil, vaporizing
          Archimonde.
  - id: frozen-throne
    name: Frozen Throne & Rise of the Lich King
    span: 22 – 23 ADP
    chapter: history
    events:
      - year: 22
        month: 1
        day: 10
        kind: pre
        title: Illidan's Dalaran Incantation
        desc: >-
          Illidan Stormrage recovers the Eye of Sargeras and begins a spell in the ruins of
          Dalaran to crack the Icecrown glacier.
      - year: 22
        month: 3
        day: 15
        kind: pre
        title: Lich King's Power Leak
        desc: >-
          Malfurion interrupts Illidan's spell, but the partial strike ruptures the Frozen
          Throne. The Lich King's power drains, weakening his psychic hold over free-willed
          undead.
      - year: 22
        month: 5
        day: 8
        kind: main
        title: Scourge Civil War in Lordaeron
        desc: >-
          Sylvanas Windrunner breaks free from the Lich King's control, founding the Forsaken.
          She drives Arthas and the Dreadlord triumvirate from the Capital City ruins.
      - year: 22
        month: 9
        day: 18
        kind: main
        title: Ascent to the Frozen Throne
        desc: >-
          Arthas arrives in Northrend to defend the Lich King. He duels Illidan at the base of
          the Icecrown glacier, ascends the pinnacle, shatters the Frozen Throne, and merges
          with Ner'zhul.
  - id: classic
    name: Classic Era Threats
    span: 25 ADP
    chapter: history
    events:
      - year: 25
        month: 1
        day: 5
        kind: pre
        title: Lady Prestor's Political Paralysis
        desc: >-
          Onyxia, disguised as Katrana Prestor, manipulates King Varian Wrynn's absence to
          withhold military aid from Westfall, Lakeshire, and Darkshire.
      - year: 25
        month: 2
        day: 12
        kind: pre
        title: Dark Iron Fire Rites in Blackrock Mountain
        desc: >-
          Shadowforge Dwarves perform rituals in the Molten Core, causing fiery tremors across
          the Burning Steppes.
      - year: 25
        month: 3
        day: 20
        kind: pre
        title: Gurubashi Hakkar Cultist Rites
        desc: >-
          Atal'ai priests conduct sacrifices in Zul'Gurub, attempting to anchor Hakkar the
          Soulflayer into the physical realm.
      - year: 25
        month: 5
        day: 1
        kind: pre
        title: Ahn'Qiraj War Effort Resource Mobilization
        desc: >-
          The Bronze Dragonflight confirms Qiraji resurgence behind the Scarab Wall. Alliance
          and Horde cities begin gathering millions of raw war materials.
      - year: 25
        month: 6
        day: 15
        kind: main
        title: Opening of the Gates of Ahn'Qiraj
        desc: >-
          Shi'vallah strikes the Scarab Gong with the recreated Scepter of the Shifting Sands.
          Joint forces breach the gates to defeat the Old God C'Thun.
      - year: 25
        month: 9
        day: 10
        kind: pre
        title: Scourge Necropolis Deployments
        desc: >-
          Kel'Thuzad positions Naxxramas over the Eastern Plaguelands, sending necrotic crystals
          to corrupt land across Azeroth.
      - year: 25
        month: 10
        day: 5
        kind: main
        title: Siege of Naxxramas
        desc: >-
          Argent Dawn champions infiltrate Naxxramas, defeating Kel'Thuzad's physical
          manifestation and recovering his phylactery.
  - id: burning-crusade
    name: The Burning Crusade
    span: 26 ADP
    chapter: history
    events:
      - year: 26
        month: 1
        day: 1
        kind: pre
        title: Dark Portal Fel Energy Spikes
        desc: >-
          Massive magical feedback radiates from the inactive Dark Portal. Highlord Kruul leads
          demon vanguards spilling through into the Blasted Lands.
      - year: 26
        month: 2
        day: 10
        kind: pre
        title: Expeditionary Force Mobilization
        desc: >-
          High Commander Kamford and Warlord Dar'toon establish staging areas at Nethergarde
          Keep and Stonard, gathering siege engines and supplies.
      - year: 26
        month: 3
        day: 1
        kind: main
        title: Reopening of the Dark Portal
        desc: >-
          Alliance and Horde forces drive the Legion back through the archway, establishing
          strongholds at Honor Hold and Thrallmar in Hellfire Peninsula.
      - year: 26
        month: 7
        day: 14
        kind: main
        title: Tempest Keep and Black Temple Campaigns
        desc: >-
          Expeditionary forces assault Netherstorm, defeating Kael'thas Sunstrider at Tempest
          Keep, and breach the Black Temple to depose Illidan Stormrage.
      - year: 26
        month: 11
        day: 20
        kind: main
        title: Sunwell Plateau Crisis
        desc: >-
          A surviving Kael'thas seizes the Sunwell to summon Kil'jaeden into Azeroth. The
          Shattered Sun Offensive defeats Kael'thas, and Prophet Velen uses the heart of the
          Naaru M'uru to reignite the Sunwell with Holy Light.
  - id: wrath
    name: Wrath of the Lich King
    span: 27 ADP
    chapter: modern
    events:
      - year: 27
        month: 1
        day: 10
        kind: pre
        title: Plagued Grain Shipments Arrive
        desc: >-
          Crates of infected grain from Northrend bypass port checks, arriving at docks in
          Stormwind and Orgrimmar.
      - year: 27
        month: 1
        day: 18
        kind: pre
        title: Ghoul Plague Outbreak
        desc: >-
          Citizens consuming the grain transform into virulent undead. Quarantine zones fail,
          forcing city guards to defend capital streets.
      - year: 27
        month: 2
        day: 1
        kind: pre
        title: Ring of Valor Mak'gora
        desc: >-
          Thrall and Garrosh Hellscream duel over war strategy at the Ring of Valor. The contest
          is interrupted by a Scourge frost wyrm attack on Orgrimmar.
      - year: 27
        month: 2
        day: 15
        kind: pre
        title: Expedition Fleet Assembly
        desc: >-
          King Varian Wrynn mobilizes the Alliance fleet at Stormwind Harbor; Thrall orders the
          construction of the Orcish Zeppelin armada at Undercity and Orgrimmar.
      - year: 27
        month: 3
        day: 10
        kind: main
        title: Northrend Landings
        desc: >-
          Alliance forces land at Valiance Keep (Borean Tundra) and Valgarde (Howling Fjord);
          the Horde Warsong Offensive establishes Warsaw Hold.
      - year: 27
        month: 6
        day: 1
        kind: main
        title: Battle of Angrathar the Wrathgate
        desc: >-
          Combined forces assault the Wrathgate. Grand Apothecary Putress betrays both armies,
          unleashing the New Plague. Highlord Bolvar Fordragon falls.
      - year: 27
        month: 6
        day: 10
        kind: main
        title: Siege of Undercity
        desc: >-
          Varian Wrynn and Thrall launch separate assaults on Undercity to purge Putress and
          Varimathras, severing Alliance-Horde diplomatic relations.
      - year: 27
        month: 8
        day: 20
        kind: main
        title: Ulduar Campaign
        desc: >-
          Brann Bronzebeard discovers Yogg-Saron's escape. Mortal champions neutralize the
          corrupted Titan Watchers and defeat the Old God.
      - year: 27
        month: 10
        day: 12
        kind: main
        title: Argent Tournament Construction
        desc: >-
          Highlord Tirion Fordring builds the tournament grounds in Icecrown to select elite
          vanguard commanders.
      - year: 27
        month: 12
        day: 5
        kind: main
        title: Siege of Icecrown Citadel
        desc: >-
          The Ashen Verdict breaches Icecrown. Tirion Fordring shatters Frostmourne, and Bolvar
          Fordragon takes up the Helm of Domination to become the new Lich King.
  - id: cataclysm
    name: The Cataclysm
    span: 28 – 29 ADP
    chapter: modern
    events:
      - year: 28
        month: 1
        day: 5
        kind: pre
        title: Twilight's Hammer Cult Infiltration
        desc: >-
          Cultist cells infiltrate civic institutions in capital cities, spreading apocalyptic
          propaganda.
      - year: 28
        month: 2
        day: 12
        kind: pre
        title: Capital City Elemental Invasions
        desc: >-
          Unstable elemental rifts erupt inside Orgrimmar, Stormwind, Ironforge, and Thunder
          Bluff. Thrall steps down as Warchief to join the Ring of Earth, appointing Garrosh
          Hellscream as Warchief.
      - year: 28
        month: 3
        day: 1
        kind: pre
        title: Seismic Earthquakes
        desc: Violent tremors split highways in Ironforge, the Southern Barrens, and Loch Modan.
      - year: 28
        month: 3
        day: 25
        kind: main
        title: The Shattering
        desc: >-
          Deathwing ruptures the boundary between Deepholm and Azeroth. Tidal waves submerge
          Thousand Needles, the Barrens splits in two, and Blackrock Mountain erupts.
      - year: 28
        month: 6
        day: 10
        kind: main
        title: Alliance-Horde Border Wars
        desc: >-
          Garrosh initiates military campaigns across Ashenvale, Azshara, and the Southern
          Barrens. The Forsaken invade Gilneas, forcing the Worgen into the Alliance.
      - year: 29
        month: 11
        day: 15
        kind: main
        title: Dragon Soul Campaign
        desc: >-
          Mortals retrieve the Dragon Soul from the Caverns of Time. Thrall and the Aspect
          Dragonflight obliterate Deathwing at the Maelstrom.
  - id: pandaria
    name: Mists of Pandaria
    span: 30 ADP
    chapter: modern
    events:
      - year: 30
        month: 1
        day: 10
        kind: pre
        title: South Seas Naval Skirmishes
        desc: Clashes between Alliance and Horde navies intensify along southern trade routes.
      - year: 30
        month: 2
        day: 15
        kind: pre
        title: Thinning of the Mists
        desc: Wandering sailors report the lifting of magical mists obscuring southern ocean charts.
      - year: 30
        month: 3
        day: 1
        kind: pre
        title: Mana Bomb Construction
        desc: >-
          Garrosh orders engineers to construct an arcano-magical weapon powered by the stolen
          Focusing Iris.
      - year: 30
        month: 4
        day: 12
        kind: main
        title: Destruction of Theramore
        desc: >-
          Garrosh lays siege to Theramore Isle before dropping the Mana Bomb, vaporizing the
          city and killing Archmage Rhonin.
      - year: 30
        month: 5
        day: 20
        kind: main
        title: Landing on Pandaria
        desc: >-
          Alliance and Horde warships wreck off the coast of the Jade Forest, introducing global
          warfare to the isolated continent.
      - year: 30
        month: 8
        day: 1
        kind: main
        title: Sha Outbreak & Divine Bell
        desc: >-
          Faction conflict unleashes the Sha spirits. Garrosh claims the Divine Bell, prompting
          Vol'jin to organize an anti-Garrosh resistance movement.
      - year: 30
        month: 12
        day: 10
        kind: main
        title: Siege of Orgrimmar
        desc: >-
          Garrosh unearths the Heart of Y'Shaarj, polluting the Vale of Eternal Blossoms.
          Alliance and rebel Horde forces besiege Orgrimmar, depose Garrosh, and elect Vol'jin
          as Warchief.
  - id: draenor-legion
    name: Warlords of Draenor & Legion
    span: 31 – 33 ADP
    chapter: modern
    events:
      - year: 31
        month: 1
        day: 15
        kind: pre
        title: Dark Portal Turns Red
        desc: >-
          Garrosh escapes to alternate Draenor with Kairozdormu. The Dark Portal on Azeroth
          turns crimson as the Iron Horde establishes a beachhead.
      - year: 31
        month: 2
        day: 1
        kind: pre
        title: Blasted Lands Iron Incursion
        desc: >-
          Vanguard armies under Commander Garad'kra pour through the portal, capturing
          Nethergarde Keep and Okril'lon Hold.
      - year: 31
        month: 2
        day: 20
        kind: main
        title: Expedition to Alternate Draenor
        desc: >-
          Archmage Khadgar leads strike forces through the Red Portal to destroy its power
          mechanism, establishing bases across Frostfire Ridge and Shadowmoon Valley.
      - year: 31
        month: 11
        day: 12
        kind: main
        title: Hellfire Citadel & Archimonde Defeat
        desc: >-
          Gul'dan usurps the Iron Horde, summoning Archimonde to Draenor. Mortal champions slay
          Archimonde, but he hurls Gul'dan into Azeroth's prime timeline before dying.
      - year: 32
        month: 1
        day: 10
        kind: pre
        title: Dalaran Ley-Line Energy Spikes
        desc: >-
          Khadgar detects massive fel surges originating from the Tomb of Sargeras on the Broken
          Isles.
      - year: 32
        month: 2
        day: 5
        kind: pre
        title: Tomb of Sargeras Harbinger Whispers
        desc: >-
          Gul'dan opens the tomb's titan portals, inviting the Burning Legion's primary invasion
          force onto Azeroth.
      - year: 32
        month: 2
        day: 25
        kind: pre
        title: Worldwide Demon Invasions
        desc: >-
          Fel dreadnoughts rain infernals down upon Westfall, Tanaris, Northern Barrens,
          Hillsbrad, and Mulgore.
      - year: 32
        month: 3
        day: 15
        kind: main
        title: Broken Shore Disaster
        desc: >-
          Alliance and Horde armies launch a joint assault on the Broken Shore. King Varian
          Wrynn and Warchief Vol'jin are mortally wounded; Sylvanas Windrunner assumes command
          of the Horde, and Anduin Wrynn is crowned King of Stormwind.
      - year: 32
        month: 8
        day: 10
        kind: main
        title: Class Order Mobilization & Suramar
        desc: >-
          Order Halls recover the Pillars of Creation, liberating Suramar from Grand Magistrix
          Elisande.
      - year: 33
        month: 2
        day: 1
        kind: main
        title: Argus Assault & Sargeras's Impalement
        desc: >-
          The Vindicaar carries mortal forces to Argus. The Pantheon seals Sargeras, but in his
          final act, he stabs Azeroth with his blade, impaling Silithus.
  - id: bfa
    name: Battle for Azeroth
    span: 33 – 34 ADP
    chapter: modern
    events:
      - year: 33
        month: 4
        day: 10
        kind: pre
        title: Azerite Fissures Sprout Worldwide
        desc: >-
          Crystallized world-blood bleeds from the wound in Silithus, prompting resource rushes
          between factions.
      - year: 33
        month: 5
        day: 1
        kind: pre
        title: Horde Northern March Feint
        desc: >-
          Sylvanas gathers Horde armies in the Northern Barrens, feigning a march to secure
          Silithus Azerite fields.
      - year: 33
        month: 5
        day: 20
        kind: main
