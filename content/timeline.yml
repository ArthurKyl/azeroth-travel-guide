# Historical Timeline.
#
# Events are grouped by era and listed in date order within each era.
#   kind: main   → filled dot, bright heading ("Main event")
#   kind: pre    → hollow dot, dimmed heading ("Pre-event")
#   chapter: history (0–26 ADP) | modern (27 ADP onward) — drives the period filter
# Dates use `month` as a number 1–12; the month name comes from `months` below.

head:
  kicker: Reference
  title: Historical Timeline
  summary: >
    The recorded chronology of Azeroth, dated on the [ADP calendar](calendar.html). Each era lists
    its **main events** alongside the **pre-event phases** that lead into them — the rumors,
    mobilizations, and omens a party can actually stumble into on the road.
  stats:
    - { value: "13", label: eras }
    - { value: "96", label: dated events }
    - { value: 0 – 41, label: ADP }

campaign_note:
  kind: info
  title: The campaign present
  text: >
    This framework is set during **Wrath of the Lich King — Year 27 ADP**. Everything before it is
    history the party can research, remember, or unearth; everything after is what the world is
    still walking into.

baselines:
  heading: Era Start Dates
  note: The opening date of each era, for setting a campaign clock.
  columns: [Era, Year, Date]

chronology:
  heading: Chronology
  note: Filter by period or event type, or search for a person, place, or battle.

