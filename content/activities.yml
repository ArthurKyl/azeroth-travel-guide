# Travel Activities. Each activity needs `checks`, then EITHER `outcomes`
# (a bulleted result list) OR `tiers` (a d20 roll table) — not both.
#
#   checks    → skill badges, joined with "or"
#   outcomes  → result: success | failure | nat  (colours the label)
#   tiers     → tier: poor | uncommon | rare | epic | legendary  (colours the range)

head:
  kicker: Core rules
  title: Travel Activities
  summary: >
    Each day on the march, every player selects one travel activity. Choose wisely — the wilds
    do not forgive idle hands.
  stats:
    - { value: "8", label: activities }
    - { value: "1", label: per character per day }

daily_loop:
  heading: The Daily Loop
  steps:
    - name: Roll weather & select pace
      text: >
        The GM rolls 1d6 on the current zone's [weather table](biomes.html). Knowing the weather, 
        the party chooses their marching speed for the day.
    - name: Assign activities
      text: >
        Each player selects **1 travel activity** for the day from the eight below to modify 
        DCs, gather resources, or protect the party.
    - name: Resolve march, encounters & exhaustion
      text: >
        Move across the hex map, resolve wilderness encounters (18–20 on d20), apply Pioneer/Motivate 
        modifiers, and roll Constitution checks against the current [biome DC](biomes.html). 
        **Failure:** gain 1 level of Exhaustion. Reaching a [Safe Spot](settlements.html) waives the check.
  stacking:
    kind: info
    title: Activity stacking
    text: "Two or more players can perform the **same activity**:"
    items:
      - >
        **Solo (double output):** both players roll separately. Each roll resolves individually,
        so the party can gain double the rewards — two separate rolls for Hunting rations or
        Scavenging loot.
      - >
        **Helping (safety first):** one player rolls as primary while the second assists. The
        primary rolls with **Advantage**, but the activity produces only **a single reward** on a
        success.

activities_section:
  heading: The 8 Activities

activities:
  - id: scouting
    name: Scouting
    goal: Keep eyes on the horizon to spot threats, ambushes, or points of interest early.
    checks: [Wisdom (Perception), Dexterity (Stealth), Wisdom (Survival)]
    outcomes:
      - result: success
        label: "Success (DC 14):"
        text: >
          the party cannot be surprised during encounters today, and hidden points of interest
          (ruins, caves, outposts) in adjacent hexes are revealed. Higher rolls yield extra intel
          at GM discretion.
      - result: failure
        label: "Failure:"
        text: >
          standard passive Perception applies and no adjacent hexes are revealed. Obvious trail
          landmarks are still noticed.

  - id: hunting
    name: Hunting
    goal: Track, stalk, or shoot wild game to feed the party.
    checks: [Wisdom (Survival), Dexterity (Stealth), Ranged Weapon Attack]
    outcomes:
      - { result: success, label: "Success (Base Biome DC):", text: "yields **1 ration**." }
      - { result: success, label: "Beat DC by +5:", text: "yields **1d4 rations**." }
      - { result: success, label: "Natural 20:", text: "yields **1d4 + Wisdom modifier** rations." }
      - { result: failure, label: "Failure:", text: find no game. }
      - { result: failure, label: "Natural 1:", text: disturb a wild predator or trigger a minor hazard. }

  - id: gathering
    name: Gathering
    goal: Harvest useful flora or remedies along the trail. Choose Rations or Remedies before rolling.
    checks: [Wisdom (Survival), Intelligence (Nature), Wisdom (Medicine)]
    outcomes:
      - { result: success, label: "Success (Base Biome DC):", text: "yields **1 ration** OR **1 dose of healing herbs** (restores 1d4 HP)." }
      - { result: success, label: "Beat DC by +5:", text: "yields **1d4 rations** OR **1 potent remedy** (restores 1d4 + 2 HP)." }
      - { result: success, label: "Natural 20:", text: "yields **1d4 + modifier** rations OR remedy doses." }
      - { result: failure, label: "Failure:", text: "find no edible plants or usable herbs." }
      - { result: failure, label: "Natural 1:", text: "harvest poisonous flora or disturb a stinging insect nest." }

  - id: cover-tracks
    name: Cover Tracks
    goal: Hide party footprints and signs of passage.
    checks: [Dexterity (Stealth), Wisdom (Survival)]
    outcomes:
      - result: success
        label: "Success (Biome DC):"
        text: >
          the party's trail becomes invisible to tracking. If currently stalked or chased, the
          party slips away and breaks pursuit.
      - result: failure
        label: "Failure:"
        text: the party leaves standard tracks.
      - result: failure
        label: "Natural 1:"
        text: accidentally leave behind a distinct personal item or create obvious snapped brush that makes tracking easier.

  - id: pray
    name: Pray / Commune
    goal: >
      Commune with your deity, ancestors, the Light, or the Loa to earn a spiritual boon
      lasting until the next daily travel phase.
    checks: [Intelligence (Religion), Wisdom (Insight), Charisma (Persuasion)]
    tiers:
      - { tier: poor, range: "1–9", text: "No response — the divine remains quiet today." }
      - { tier: uncommon, range: "10–14", text: "**Light Blessing:** Gain temporary HP equal to your Proficiency Bonus." }
      - { tier: rare, range: "15–19", text: "**Ancestor's Grace:** Gain 1 floating Advantage to use on any single attack roll, saving throw, or ability check today." }
      - { tier: legendary, range: "20+", text: "**Divine Favor:** Gain +1 AC and +1 to all saving throws for the day." }

  - id: motivate
    name: Motivate
    goal: >
      Use inspiring war chants, stories, music, or military discipline to keep spirits high despite physical strain.
    checks: [Charisma (Performance), Charisma (Persuasion), Charisma (Intimidation), Strength (Athletics)]
    outcomes:
      - result: success
        label: "Success (Biome DC):"
        text: >
          Remove **1 level of Exhaustion** gained today from **1 target player**.
      - result: success
        label: "Beat DC by +5:"
        text: >
          Remove **1 level of Exhaustion** gained today from **up to 2 target players**.
      - result: nat
        label: "Natural 20:"
        text: >
          Rally the entire party — remove 1 level of Exhaustion gained today from **all party members**.
      - result: failure
        label: "Failure:"
        text: No effect.

  - id: pioneer
    name: Pioneer
    goal: >
      Blaze a cleaner trail through dense brush, test hazardous ice, or clear physical obstacles ahead of the march.
    checks: [Wisdom (Survival), Strength (Athletics), Intelligence (Nature)]
    tiers:
      - { tier: poor, range: "Fail (<10)", text: "The Pioneer takes a **−2 penalty** on their own Biome Exhaustion save today due to physical strain." }
      - { tier: uncommon, range: "10–14", text: "Lowers the daily Biome Exhaustion DC by **−2** for the entire party." }
      - { tier: rare, range: "15+", text: "Lowers the daily Biome Exhaustion DC by **−4** for the entire party." }
      - { tier: legendary, range: "Natural 20", text: "Pathfinder mastery — the entire party **automatically succeeds** their Biome Exhaustion save today." }

  - id: scavenging
    name: Scavenging
    goal: >
      Search old battlefields, ruined camps, dry creek beds, and debris for forgotten wealth, trade goods, or secrets.
      *(Note: Regardless of the check total, the GM may always choose to award unique quest items, lore scraps, or trinkets).*
    checks: [Intelligence (Investigation), Wisdom (Perception), Dexterity (Sleight of Hand), Intelligence (History)]
    tiers:
      - { tier: poor, range: "1–9", text: "Find no standard coins or valuable loot, though strange or cursed curiosities may still be uncovered." }
      - { tier: uncommon, range: "10–14", text: "Find minor scraps and copper/silver trinkets worth **1d6 gold**." }
      - { tier: rare, range: "15–19", text: "Find valuable salvage, trade supplies, or coins worth **3d6 gold**." }
      - { tier: legendary, range: "20+", text: "Find an intact gemstone, rare crafting ingredient, or pouch worth **5d6 gold**." }
